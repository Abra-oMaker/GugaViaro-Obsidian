name: Sync Vault e Deploy Quartz

on:
  repository_dispatch:
    types: [vault-updated]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório do Quartz
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout vault (repositório de origem)
        uses: actions/checkout@v4
        with:
          repository: Abra-oMaker/Obsidian
          path: vault-source
          token: ${{ secrets.VAULT_ACCESS_TOKEN }}

      - name: Copiar pastas publicadas para content/
        run: |
          rm -rf content/*
          cp -r "vault-source/Notas - Método Datenbase/." content/
          cp -r "vault-source/Arquivos/." content/
          mkdir -p content/Imagens
          cp -r "vault-source/Imagens/." content/Imagens/
          echo "✅ Notas copiadas para content/"

      - name: Criar página inicial (Bem vindo)
        run: |
          printf -- '---\ntitle: Bem vindo\n---\n\n![[Bem vindo]]\n' > content/index.md
          echo "✅ index.md criado"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências Python
        run: pip install pyyaml

      - name: Gerar wikilinks nas notas de índice
        run: python generate_index_links.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-and-deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4name: Sync Vault e Deploy Quartz

